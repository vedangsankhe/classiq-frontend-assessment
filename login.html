<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — ClassIQ</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-mark">🎓</span>
      ClassIQ
    </a>

    <nav class="main-nav" id="mainNav">
      <a href="dashboard.html" class="nav-link">Courses</a>
    </nav>

    <div class="header-actions">
      <a href="login.html" class="btn btn-dark btn-sm"><span>Login</span></a>
      <a href="signup.html" class="btn btn-dark btn-sm"><span>SignUp</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </div>
</header>

<main class="auth-main">
  <form class="auth-card" id="loginForm" novalidate>
    <h1>Login</h1>

    <div class="field">
      <input type="email" id="email" placeholder="Enter Your Email" autocomplete="email" />
      <p class="field-error" id="emailError"></p>
    </div>

    <div class="field">
      <input type="password" id="password" placeholder="Enter Your Password" autocomplete="current-password" />
      <p class="field-error" id="passwordError"></p>
    </div>

    <button type="submit" class="btn btn-green btn-block">Login</button>

    <p class="form-status" id="formStatus"></p>

    <p class="form-note">Don't have an account? <a href="signup.html">SignUp</a></p>

    <p class="demo-hint">Demo access — email: <strong>demo@classiq.com</strong>, password: <strong>demo123</strong></p>
  </form>
</main>

<script src="js/script.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
